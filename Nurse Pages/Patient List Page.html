<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patient List — Clinic</title>
    <link rel="stylesheet" href="shared-nurse.css" />
    <link rel="stylesheet" href="Patient List Page.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="Patient List Page.js" defer></script>
  </head>
  <body>
    <div class="top">
      <div class="navbar">
        <nav class="nav">
          <a>
            <img src="image.png" alt="Clinic Logo" class="logo" />
          </a>
          <div class="links">
            <ul class="nav-links">
              <li><a href="Nurse Dashboard.html">Home</a></li>
              <li>
                <a href="Patient List Page.html" class="active">Patient List</a>
              </li>
              <li>
                <a href="Patient Vitals Entry Page.html">Record Vitals</a>
              </li>
              <li>
                <a href="Patient Basic Records View Page.html"
                  >Patient Records</a
                >
              </li>
              <li><a href="Patient Referral Page.html">Refer Patient</a></li>
              <li><a href="Daily Report Page.html">Daily Report</a></li>
            </ul>
          </div>
          <div class="nav-buttons">
            <button id="profileBtn" class="profile">Profile</button>
            <button id="logoutBtn" class="logout">Logout</button>
          </div>
        </nav>
      </div>
    </div>

    <header class="header">
      <div class="container">
        <div class="hero-left">
          <h1>Patient List</h1>
          <p class="muted">
            Manage and search patients registered in the clinic.
          </p>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="controls">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="patientSearch"
            placeholder="Search by name or ID..."
          />
        </div>
        <div class="actions">
          <button class="btn" id="btnAll">All Patients</button>
          <button class="btn" id="btnWaiting">Waiting</button>
          <button class="btn btn-primary" id="btnAdd">+ New Patient</button>
        </div>
      </section>

      <section class="table-card">
        <table class="patient-table">
          <thead>
            <tr>
              <th>Patient ID</th>
              <th>Full Name</th>
              <th>Gender</th>
              <th>Age</th>
              <th>Department</th>
              <th>Appt Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="patientTable"></tbody>
        </table>
      </section>

      <div class="pagination">
        <button class="pagination-btn" id="prevPage">
          <i class="fas fa-chevron-left"></i>
        </button>
        <span id="pageInfo">Page 1 of 1</span>
        <button class="pagination-btn" id="nextPage">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </main>

    <script src="shared.js" defer></script>
    <script src="Patient List Page.js" defer></script>
  </body>
</html>
