<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nile University Clinic Management System</title>
    <link rel="stylesheet" href="homepage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <!--NavBar-->
    <div class="top">
        <div class="navbar">
            <nav class="nav">
                <a>
                    <img src="image.png" alt="Nile University Logo" class="logo">
                </a>
                <div class="links">
                    <ul class="nav-links">
                        <li>
                            <a>
                                <p>Home</p>
                            </a>
                        </li>
                        <li>
                            <a>
                                <p>Appointments</p>
                            </a>
                            <!-- <div class="dropdown">
                                <span class="dropdown-text">Appointments</span>
                                <div class="dropdown-menu">
                                    <div>View Appointments</div>
                                    <div>Book an Appointment</div>
                                </div>
                            </div> -->
                        </li>

                        <li>
                            <a>
                                <p>Prescriptions</p>
                            </a>
                        </li>

                        <li>
                            <a>
                                <p>Medical History</p>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="nav-buttons">
                    <button class="profile">Profile</button>
                    <button class="logout">Logout</button>
                </div>
            </nav>
        </div>
    </div>

    <!-- Hero Section-->
    <div class="hero">
        <div class="user-name">
            <p class="welcome">Welcome <br> <span class="user">Cynthia George</span></p>
        </div>
        <div class="user-class">
            <div class="left">
                <p class="header">USER CLASS</p>
                <p class="content">Student</p>
            </div>
            <div class="right">
                <i class="fa-solid fa-school"></i>
            </div>
        </div>
        <div class="id-num-box">
            <div class="left">
                <p class="header">STUDENT ID</p>
                <p class="content">20220000</p>
            </div>
            <div class="right">
                <i class="fa-regular fa-id-badge"></i>
            </div>
            
        </div>
        <div class="quick-book">
            <button class="book">+ Book Appointment</button>
        </div>
    </div>

</html>
